<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pradz Store - Toko Akun Digital</title>
<style>
:root{
  --bg:#0b1020;--bg2:#121933;--panel:#161e3c;--panel2:#1c2650;--border:#26315e;
  --text:#e6ebff;--muted:#8a94b8;--primary:#9333ea;--primary2:#a855f7; /* Warna ungu disesuaikan banner */
  --success:#22c55e;--danger:#ef4444;--warning:#f59e0b;--info:#38bdf8;
  --radius:12px;--radius-sm:8px;--shadow:0 10px 30px rgba(0,0,0,.5);
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
/* BACKGROUND GAMBAR PRADZ STORE */
body{
  font-family:var(--font);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh;
  background-color: var(--bg);
  background-image: 
    linear-gradient(rgba(11, 16, 32, 0.85), rgba(11, 16, 32, 0.95)), /* Efek gelap transparan */
    url('file_000000004c5c8211b83ea6f4580aea7b.png'); /* GANTI NAMA FILE BANNER DI SINI */
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  background-repeat: no-repeat;
}
a{color:var(--primary2);text-decoration:none}a:hover{text-decoration:underline}
.muted{color:var(--muted)}.small{font-size:12px}.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 14px;border-radius:var(--radius-sm);border:1px solid transparent;background:var(--panel2);color:var(--text);cursor:pointer;font-size:13px;font-weight:600;font-family:inherit;transition:.15s}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary2)}
.btn-danger{background:var(--danger);color:#fff}.btn-success{background:var(--success);color:#fff}
.btn-warning{background:var(--warning);color:#111}
.btn-ghost{background:rgba(22,30,60,0.6);border-color:var(--border);color:var(--muted);backdrop-filter:blur(4px)}
.btn-ghost:hover{color:var(--text);border-color:var(--primary)}
.btn-sm{padding:5px 10px;font-size:12px}.btn-block{width:100%}
input,select,textarea{width:100%;padding:10px 12px;border-radius:var(--radius-sm);background:rgba(18,25,51,0.8);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:13px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(147,51,234,.25)}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:12px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
label>input,label>select,label>textarea{margin-top:6px;text-transform:none;letter-spacing:0;font-weight:400;color:var(--text)}

/* UI UTAMA */
.auth-view{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{width:100%;max-width:420px;background:rgba(22,30,60,0.85);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:var(--radius);padding:32px;box-shadow:var(--shadow)}
.brand{text-align:center;margin-bottom:24px}
.brand-logo{width:56px;height:56px;border-radius:14px;margin:0 auto 12px;background:linear-gradient(135deg,var(--primary),#d946ef);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff}
.brand h1{font-size:22px;margin-bottom:4px;text-transform:uppercase;letter-spacing:2px}
.auth-form{display:flex;flex-direction:column}
.auth-links{display:flex;justify-content:space-between;margin-top:14px;font-size:13px}
.auth-message{margin-top:16px;padding:10px 12px;border-radius:var(--radius-sm);background:rgba(147,51,234,.15);border:1px solid rgba(147,51,234,.4);font-size:13px}
.auth-message.error{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4);color:#fca5a5}
.auth-message.success{background:rgba(34,197,94,.1);border-color:rgba(34,197,94,.4);color:#86efac}

.topnav{display:flex;align-items:center;gap:16px;padding:14px 24px;border-bottom:1px solid var(--border);background:rgba(11,16,32,.8);backdrop-filter:blur(10px);position:sticky;top:0;z-index:10;flex-wrap:wrap}
.topnav .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:1px;color:#fff}
.topnav .logo img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--primary)}
.topnav nav{display:flex;gap:4px;flex-wrap:wrap}
.topnav nav a{padding:8px 12px;border-radius:var(--radius-sm);color:var(--muted);font-weight:600;font-size:13px}
.topnav nav a:hover,.topnav nav a.active{background:var(--panel2);color:var(--text);text-decoration:none}
.topnav .spacer{flex:1}
.container{max-width:1200px;margin:0 auto;padding:24px}

/* KARTU & PANEL */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:rgba(22,30,60,0.8);backdrop-filter:blur(6px);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:.15s;display:flex;flex-direction:column}
.card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 4px 20px rgba(147,51,234,0.2)}
.card-img{aspect-ratio:1;background:var(--bg2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;overflow:hidden}
.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.card-title{font-weight:700;font-size:14px;line-height:1.3}
.card-price{color:var(--primary2);font-weight:800;font-size:16px}
.card-cat{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.panel{background:rgba(22,30,60,0.85);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:12px;flex-wrap:wrap}
.panel-title{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--primary2)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th{text-align:left;padding:10px 12px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);font-weight:700}
td{padding:10px 12px;border-bottom:1px solid rgba(38,49,94,.5);vertical-align:middle}
tr:hover td{background:rgba(147,51,234,.05)}
.empty-row td{text-align:center;color:var(--muted);padding:24px}
.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.badge-success{background:rgba(34,197,94,.15);color:#86efac}
.badge-danger{background:rgba(239,68,68,.15);color:#fca5a5}
.badge-warning{background:rgba(245,158,11,.15);color:#fcd34d}
.badge-info{background:rgba(56,189,248,.15);color:#7dd3fc}
.badge-muted{background:rgba(138,148,184,.15);color:var(--muted)}

/* MODAL, TOAST, DLL */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;backdrop-filter:blur(3px)}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15px;color:var(--primary2)}
.modal-body{padding:20px;overflow-y:auto}
.toast{position:fixed;bottom:20px;right:20px;padding:12px 18px;border-radius:var(--radius-sm);background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:600;box-shadow:var(--shadow);z-index:200;max-width:320px}
.toast.success{background:rgba(34,197,94,.2);border-color:var(--success);color:#86efac}
.toast.error{background:rgba(239,68,68,.2);border-color:var(--danger);color:#fca5a5}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:flex-end}
.filters>div{min-width:140px;flex:1;max-width:220px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:rgba(22,30,60,0.8);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.stat-label{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-value{font-size:20px;font-weight:800}
.stat-value.primary{color:var(--primary2)}.stat-value.success{color:var(--success)}
.stat-value.danger{color:var(--danger)}.stat-value.warning{color:var(--warning)}
.qris-box{background:rgba(18,25,51,0.8);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;margin:16px 0}
.qris-box img{max-width:280px;width:100%;border-radius:8px;background:#fff;padding:8px;cursor:zoom-in}
.wa-box{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.4);border-radius:var(--radius);padding:14px;margin:12px 0}
.acct-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--border)}
.acct-row b{font-family:monospace}
.loading{text-align:center;padding:40px;color:var(--muted)}
@media(max-width:640px){
  .container{padding:16px}.topnav{padding:12px 16px}
  .auth-card{padding:24px}.stat-value{font-size:17px}
  .modal-body{padding:16px}th,td{padding:8px 10px}
  .topnav .logo img {width: 30px; height: 30px;}
}
</style>
</head>
<body>

<div id="authView" class="auth-view">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-logo" style="background:none; width:80px; height:80px; margin-bottom:8px;">
        <!-- LOGO MENGGUNAKAN GAMBAR BANNER DARI GITHUB -->
        <img src="file_0000000011108211ab782507cc16c80a.png" style="width:100%;height:100%;object-fit:contain;border-radius:12px;" alt="Logo Pradz" />
      </div>
      <h1>Pradz Store</h1>
      <p class="muted" id="authSubtitle">Masuk untuk melanjutkan</p>
    </div>
    <form id="loginForm" class="auth-form">

      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Masuk</button>
      <div class="auth-links">
        <a href="#" id="toRegister">Daftar akun</a>
        <a href="#" id="toForgot">Lupa password?</a>
      </div>
    </form>
    <form id="registerForm" class="auth-form hidden">
      <label>Nama <input type="text" id="regName" required minlength="2" maxlength="40" /></label>
      <label>Email <input type="email" id="regEmail" required autocomplete="email" /></label>
      <label>Password <input type="password" id="regPassword" required minlength="6" autocomplete="new-password" /></label>
      <button type="submit" class="btn btn-primary btn-block" id="registerBtn">Daftar</button>
      <div class="auth-links"><a href="#" id="toLoginFromReg">Sudah punya akun? Masuk</a></div>
    </form>
    <form id="forgotForm" class="auth-form hidden">
      <label>Email <input type="email" id="forgotEmail" required autocomplete="email" /></label>
      <button type="submit" class="btn btn-primary btn-block" id="forgotBtn">Kirim Link Reset</button>
      <div class="auth-links"><a href="#" id="toLoginFromForgot">Kembali ke login</a></div>

</div>

<div id="appView" class="hidden">
  <header class="topnav">
    <div class="logo">
      <img src="file_0000000011108211ab782507cc16c80a.png" alt="Logo" />
      <span>PRADZ STORE</span>
    </div>
    <nav id="mainNav"></nav>
    <div class="spacer"></div>
    <span class="muted small" id="navUser">—</span>
    <button class="btn btn-ghost btn-sm" id="logoutBtn">Keluar</button>
  </header>
  <main class="container" id="content"></main>
</div>

<div id="modalBackdrop" class="modal-backdrop hidden">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modalTitle">Form</h3>
      <button class="btn btn-ghost" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script type="module">
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDxiDzk0n4VB9AqqT49sJxn8NDY3ktOf2s",
  authDomain: "xii-tjkt-3.firebaseapp.com",
  databaseURL: "https://xii-tjkt-3-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "xii-tjkt-3",
  storageBucket: "xii-tjkt-3.firebasestorage.app",
  messagingSenderId: "241956035753",
  appId: "1:241956035753:web:c712603315b474c5909db8"
};

const ROOT = "toko";
const WA_NUMBER = "6285814497382";

// GAMBAR QRIS DEFAULT DARI GITHUB KAMU
// Jika admin upload lewat dashboard, maka yang dipakai adalah yang di database
const QRIS_FALLBACK = "qr_ID1026626918621_28.10.26_1793189100_1793189100315.jpeg"; 

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signOut, sendPasswordResetEmail, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import {
  getDatabase, ref, get, set, update, push, remove, onValue
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp(FIREBASE_CONFIG);
const auth = getAuth(app);
const db = getDatabase(app);

const state = {
  user: null, profile: null, page: "home", route: { id: null },
  listeners: [],
  data: { products:{}, categories:{}, orders:{}, carts:{}, qris:{}, users:{}, settings:{} }
};

const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const rp = n => "Rp"+Number(n||0).toLocaleString("id-ID");
const fmtDate = ts => ts ? new Date(ts).toLocaleString("id-ID",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "-";
const isAdmin = () => state.profile?.role === "admin";
const escapeHTML = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg,type="success"){
  const el=$("#toast"); el.textContent=msg; el.className=`toast ${type}`; el.classList.remove("hidden");
  clearTimeout(toast._t); toast._t=setTimeout(()=>el.classList.add("hidden"),2800);
}
function openModal(title,bodyHTML,onSubmit){
  $("#modalTitle").textContent=title; $("#modalBody").innerHTML=bodyHTML;
  $("#modalBackdrop").classList.remove("hidden");
  const f=$("#modalBody form");
  if(f&&onSubmit){ f.addEventListener("submit",async e=>{
    e.preventDefault();
    const btn=f.querySelector("button[type=submit]"); if(btn){btn.disabled=true;btn.textContent="Menyimpan...";}
    try{ await onSubmit(new FormData(f)); }catch(err){ toast(err.message||"Error","error"); }
    finally{ if(btn){btn.disabled=false;btn.textContent=btn.dataset.label||"Simpan";} }
  }); }
  $("#modalClose").onclick=closeModal;
}
function closeModal(){ $("#modalBackdrop").classList.add("hidden"); $("#modalBody").innerHTML=""; }

function fileToBase64(file,maxKB=250){
  return new Promise((res,rej)=>{
    if(!/^image\/(png|jpe?g|webp)$/.test(file.type)) return rej(new Error("Format harus JPG/PNG/WEBP"));
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement("canvas");
        let {width,height}=img;
        const maxDim=800;
        if(width>maxDim||height>maxDim){
          const ratio=Math.min(maxDim/width,maxDim/height);
          width=Math.round(width*ratio); height=Math.round(height*ratio);
        }
        canvas.width=width; canvas.height=height;
        canvas.getContext("2d").drawImage(img,0,0,width,height);
        let quality=0.8, out=canvas.toDataURL("image/jpeg",quality);
        while(out.length/1024 > maxKB*1.37 && quality>0.3){
          quality-=0.1; out=canvas.toDataURL("image/jpeg",quality);
        }
        if(out.length/1024 > maxKB*1.37) return rej(new Error("Gambar terlalu besar"));
        res(out);
      };
      img.onerror=()=>rej(new Error("Gagal baca gambar"));
      img.src=e.target.result;
    };
    reader.onerror=()=>rej(new Error("Gagal baca file"));
    reader.readAsDataURL(file);
  });
}

function friendlyAuthError(err){
  const map={
    "auth/invalid-email":"Email tidak valid.","auth/user-not-found":"Akun tidak ditemukan.",
    "auth/wrong-password":"Password salah.","auth/invalid-credential":"Email atau password salah.",
    "auth/email-already-in-use":"Email sudah terdaftar.","auth/weak-password":"Password minimal 6 karakter.",
    "auth/too-many-requests":"Terlalu banyak percobaan.","auth/network-request-failed":"Koneksi bermasalah."
  };
  return map[err?.code]||err?.message||"Terjadi kesalahan.";
}

const authView=$("#authView"), appView=$("#appView");
function showAuthMessage(msg,type=""){
  const el=$("#authMessage"); el.className=`auth-message ${type}`; el.textContent=msg;
  el.classList.remove("hidden"); setTimeout(()=>el.classList.add("hidden"),6000);
}
function switchAuthForm(w){
  $("#loginForm").classList.toggle("hidden",w!=="login");
  $("#registerForm").classList.toggle("hidden",w!=="register");
  $("#forgotForm").classList.toggle("hidden",w!=="forgot");
  $("#authSubtitle").textContent=w==="login"?"Masuk untuk melanjutkan":w==="register"?"Buat akun baru":"Reset password akunmu";
}
$("#toRegister").onclick=e=>{e.preventDefault();switchAuthForm("register")};
$("#toForgot").onclick=e=>{e.preventDefault();switchAuthForm("forgot")};
$("#toLoginFromReg").onclick=e=>{e.preventDefault();switchAuthForm("login")};
$("#toLoginFromForgot").onclick=e=>{e.preventDefault();switchAuthForm("login")};

$("#loginForm").addEventListener("submit",async e=>{
  e.preventDefault(); const b=$("#loginBtn"); b.disabled=true; b.textContent="Memuat...";
  try{ await signInWithEmailAndPassword(auth,$("#loginEmail").value.trim(),$("#loginPassword").value); }
  catch(err){ showAuthMessage(friendlyAuthError(err),"error"); }
  finally{ b.disabled=false; b.textContent="Masuk"; }
});

$("#registerForm").addEventListener("submit",async e=>{
  e.preventDefault(); const b=$("#registerBtn"); b.disabled=true; b.textContent="Memuat...";
  try{
    const name=$("#regName").value.trim(), email=$("#regEmail").value.trim(), pass=$("#regPassword").value;
    if(name.length<2) throw new Error("Nama minimal 2 karakter");
    if(pass.length<6) throw new Error("Password minimal 6 karakter");
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    const snap=await get(ref(db,`${ROOT}/users`));
    const isFirst=!snap.exists()||Object.keys(snap.val()).length===0;
    await set(ref(db,`${ROOT}/users/${cred.user.uid}`),{
      email, displayName:name, role:isFirst?"admin":"pembeli", createdAt:Date.now()
    });
    showAuthMessage(isFirst?"Akun Admin dibuat!":"Akun dibuat, silakan masuk.","success");
  }catch(err){ showAuthMessage(friendlyAuthError(err),"error"); }
  finally{ b.disabled=false; b.textContent="Daftar"; }
});

$("#forgotForm").addEventListener("submit",async e=>{
  e.preventDefault(); const b=$("#forgotBtn"); b.disabled=true; b.textContent="Mengirim...";
  try{ await sendPasswordResetEmail(auth,$("#forgotEmail").value.trim()); showAuthMessage("Link reset dikirim. Cek email.","success"); }
  catch(err){ showAuthMessage(friendlyAuthError(err),"error"); }
  finally{ b.disabled=false; b.textContent="Kirim Link Reset"; }
});

onAuthStateChanged(auth,async user=>{
  state.listeners.forEach(u=>{try{u()}catch{}}); state.listeners=[];
  if(!user){ state.user=null; state.profile=null; authView.classList.remove("hidden"); appView.classList.add("hidden"); return; }
  state.user=user;
  const snap=await get(ref(db,`${ROOT}/users/${user.uid}`));
  if(!snap.exists()){
    await set(ref(db,`${ROOT}/users/${user.uid}`),{email:user.email,displayName:user.email.split("@")[0],role:"pembeli",createdAt:Date.now()});
    state.profile={email:user.email,displayName:user.email.split("@")[0],role:"pembeli"};
  } else state.profile=snap.val();
  authView.classList.add("hidden"); appView.classList.remove("hidden");
  $("#navUser").textContent = `${state.profile.displayName} (${state.profile.role})`;
  state.page="home"; state.route={id:null};
  attachListeners(); renderNav(); renderPage();
});

$("#logoutBtn").onclick=async()=>{ state.listeners.forEach(u=>{try{u()}catch{}}); state.listeners=[]; await signOut(auth); };

function attachListeners(){
  ["products","categories","qris","settings","users"].forEach(p=>{
    const unsub=onValue(ref(db,`${ROOT}/${p}`),snap=>{
      state.data[p]=snap.val()||{};
      if(!appView.classList.contains("hidden")){ renderNav(); renderPage(); }
    },err=>console.warn("listen",p,err));
    state.listeners.push(unsub);
  });
  if(state.user){
    const isAdm = state.profile.role==="admin";
    const unsub=onValue(ref(db,`${ROOT}/orders`),snap=>{
      const all=snap.val()||{}; const filtered={};
      Object.entries(all).forEach(([k,v])=>{ if(isAdm||v.uid===state.user.uid) filtered[k]=v; });
      state.data.orders=filtered;
      if(!appView.classList.contains("hidden")) renderPage();
    },err=>console.warn("orders",err));
    state.listeners.push(unsub);

    const unsubCart=onValue(ref(db,`${ROOT}/carts/${state.user.uid}`),snap=>{
      state.data.carts=snap.val()||{};

}

    {id:"cart",label:`Keranjang${cartCount()?` (${cartCount()})`:""}`},

  items.forEach(it=>{

function bindPageActions(){
  $$("[data-go]").forEach(el=>el.onclick=e=>{e.preventDefault();state.page=el.dataset.go;state.route={id:null};renderNav();renderPage();});
  $$("[data-go-detail]").forEach(el=>el.onclick=()=>{state.page="detail";state.route={id:el.dataset.goDetail};renderNav();renderPage();});
  $$("[data-add-cart]").forEach(el=>el.onclick=()=>addToCart(el.dataset.addCart,1));
  $$("[data-buy]").forEach(el=>el.onclick=()=>{
    const p=state.data.products[el.dataset.buy]; if(!p) return;
    state.page="checkout"; state.route={items:[{pid:el.dataset.buy,name:p.name,price:p.price,qty:1}]};
    renderNav(); renderPage();
  });
  $$("[data-del-cart]").forEach(el=>el.onclick=async()=>{ await remove(ref(db,`${ROOT}/carts/${state.user.uid}/${el.dataset.delCart}`)); toast("Dihapus"); });
  $$("[data-qty]").forEach(el=>el.onchange=async()=>{ const q=Math.max(1,Number(el.value)||1); await update(ref(db,`${ROOT}/carts/${state.user.uid}/${el.dataset.qty}`),{qty:q}); });
  const checkoutBtn=$("[data-checkout]");
  if(checkoutBtn) checkoutBtn.onclick=()=>{
    const cart=state.data.carts||{};
    const items=Object.entries(cart).map(([pid,q])=>{ const p=state.data.products?.[pid]; return p?{pid,name:p.name,price:p.price,qty:q.qty}:null; }).filter(Boolean);
    if(!items.length) return toast("Keranjang kosong","error");
    state.page="checkout"; state.route={items,from:"cart"}; renderNav(); renderPage();
  };
  const fSearch=$("#fSearch"), fCat=$("#fCat"), fSort=$("#fSort");
  if(fSearch&&fCat&&fSort){
    const apply=()=>{
      const q=fSearch.value.toLowerCase(), cat=fCat.value, sort=fSort.value;
      let arr=Object.entries(state.data.products||{}).map(([id,p])=>({id,...p}));
      if(q) arr=arr.filter(p=>p.name.toLowerCase().includes(q));
      if(cat) arr=arr.filter(p=>p.category===cat);
      if(sort==="asc") arr.sort((a,b)=>a.price-b.price);
      else if(sort==="desc") arr.sort((a,b)=>b.price-a.price);
      else arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
      $("#catalogGrid").innerHTML=arr.map(cardProduct).join("")||`<p class="muted small">Tidak ada produk cocok.</p>`;
      $$("[data-go-detail]").forEach(el=>el.onclick=()=>{state.page="detail";state.route={id:el.dataset.goDetail};renderNav();renderPage();});
    };
    fSearch.oninput=apply; fCat.onchange=apply; fSort.onchange=apply;
  }
  const co=$("#checkoutForm");
  if(co) co.onsubmit=async e=>{
    e.preventDefault(); const fd=new FormData(co);
    const items=state.route.items||[];
    const total=items.reduce((s,x)=>s+Number(x.price||0)*x.qty,0);
    const id="TRX"+Date.now();
    const order={id,uid:state.user.uid,buyerName:fd.get("buyerName"),buyerEmail:fd.get("buyerEmail"),note:fd.get("note")||"",items:items.map(i=>({pid:i.pid,name:i.name,price:i.price,qty:i.qty})),total,status:"pending_payment",createdAt:Date.now(),proof:"",accounts:null};
    await set(ref(db,`${ROOT}/orders/${id}`),order);
    for(const i of items){ const p=state.data.products[i.pid]; if(!p) continue; await update(ref(db,`${ROOT}/products/${i.pid}`),{stock:Math.max(0,Number(p.stock||0)-i.qty)}); }
    if(state.route.from==="cart"){ for(const i of items){ await remove(ref(db,`${ROOT}/carts/${state.user.uid}/${i.pid}`)); } }
    state.page="payment"; state.route={id}; renderNav(); renderPage();
  };
  const pf=$("#proofForm");
  if(pf) pf.onsubmit=async e=>{
    e.preventDefault(); const file=new FormData(pf).get("proof");
    if(!file||!file.size) return toast("Pilih file","error");
    try{ const b64=await fileToBase64(file); await update(ref(db,`${ROOT}/orders/${state.route.id}`),{proof:b64,status:"waiting_verification",proofUploadedAt:Date.now()}); toast("Bukti terkirim"); }
    catch(err){ toast(err.message,"error"); }
  };
  $$("[data-copy]").forEach(el=>el.onclick=()=>navigator.clipboard.writeText(el.dataset.copy).then(()=>toast("ID disalin")));
  $$("[data-copy-text]").forEach(el=>el.onclick=()=>navigator.clipboard.writeText(el.dataset.copyText).then(()=>toast("Disalin")));
  $$("[data-toggle-pass]").forEach(el=>el.onclick=()=>{
    const idx=el.dataset.togglePass; const b=$("#p-"+idx); if(!b) return;
    if(b.dataset.shown==="1"){ b.textContent="••••••••"; b.dataset.shown="0"; el.textContent="Lihat"; }
    else{ const o=state.data.orders[state.route.id]; const acc=o.accounts?.[idx]||{}; b.textContent=acc.password||"-"; b.dataset.shown="1"; el.textContent="Sembunyikan"; }
  });
  const qf=$("#qrisForm");
  if(qf) qf.onsubmit=async e=>{
    e.preventDefault(); const file=new FormData(qf).get("qris");
    if(!file||!file.size) return toast("Pilih file QRIS","error");
    try{ const b64=await fileToBase64(file,400); await set(ref(db,`${ROOT}/qris/main`),{image:b64,updatedAt:Date.now()}); toast("QRIS disimpan"); }
    catch(err){ toast(err.message,"error"); }
  };
  $$("[data-action]").forEach(el=>el.onclick=()=>handleAdminAction(el.dataset.action,el));
  $$("[data-view-order]").forEach(el=>el.onclick=()=>{
    const id=el.dataset.viewOrder; const o=state.data.orders[id]; if(!o) return;
    if(o.status==="delivered"){ state.page="account"; state.route={id}; renderNav(); renderPage(); }
    else if(o.status==="pending_payment"||o.status==="waiting_verification"){ state.page="payment"; state.route={id}; renderNav(); renderPage(); }
    else{
      openModal("Detail Pesanan",`
        <p><b>ID:</b> ${o.id}</p><p><b>Status:</b> ${badgeOrder(o.status)}</p>
        <p><b>Total:</b> ${rp(o.total)}</p>
        <ul>${(o.items||[]).map(i=>`<li>${escapeHTML(i.name)} x${i.qty} = ${rp(i.price*i.qty)}</li>`).join("")}</ul>`);
    }
  });
}
async function addToCart(pid,qty){
  if(!state.user) return;
  const p=state.data.products[pid]; if(!p) return;
  if(Number(p.stock||0)<=0) return toast("Stok habis","error");
  const current=Number(state.data.carts?.[pid]?.qty||0);
  const newQty=Math.min(Number(p.stock),current+qty);
  await set(ref(db,`${ROOT}/carts/${state.user.uid}/${pid}`),{pid,qty:newQty,addedAt:Date.now()});
  toast("Ditambahkan ke keranjang");
}
function handleAdminAction(action,el){
  if(!isAdmin()) return toast("Akses ditolak","error");
  const id=el.dataset.id;
  if(action==="add-product") return productForm();
  if(action==="edit-product") return productForm(id);
  if(action==="del-product") return deleteProduct(id);
  if(action==="add-cat") return categoryForm();
  if(action==="del-cat") return deleteCategory(id);
  if(action==="del-qris") return deleteQris();
  if(action==="approve-order") return approveOrder(id);
  if(action==="reject-order") return rejectOrder(id);
  if(action==="deliver-order") return deliverOrder(id);
}
function productForm(id){
  const p=id?state.data.products[id]:null;
  const cats=Object.values(state.data.categories||{});
  openModal(id?"Edit Produk":"Tambah Produk",`
    <form>
      <label>Nama <input name="name" value="${escapeHTML(p?.name||"")}" required /></label>
      <label>Kategori <select name="category">${cats.map(c=>`<option ${p?.category===c.name?"selected":""}>${escapeHTML(c.name)}</option>`).join("")}</select></label>
      <label>Harga <input type="number" name="price" value="${p?.price||0}" min="0" required /></label>
      <label>Stok <input type="number" name="stock" value="${p?.stock||1}" min="0" required /></label>
      <label>Deskripsi <textarea name="description" rows="3">${escapeHTML(p?.description||"")}</textarea></label>
      <label>Foto Produk ${p?.image?"(kosongkan jika tidak ganti)":""} <input type="file" name="image" accept="image/*" ${id?"":"required"} /></label>
      <button class="btn btn-primary btn-block" type="submit" data-label="${id?"Simpan":"Tambah"}">${id?"Simpan":"Tambah"}</button>
    </form>`,async fd=>{
      let image=p?.image||"";
      const file=fd.get("image");
      if(file&&file.size){ image=await fileToBase64(file); }
      const data={name:fd.get("name").trim(),category:fd.get("category"),price:Number(fd.get("price")),stock:Number(fd.get("stock")),description:fd.get("description").trim(),image,createdAt:p?.createdAt||Date.now(),updatedAt:Date.now()};
      if(id) await update(ref(db,`${ROOT}/products/${id}`),data);
      else{ const newId=push(ref(db,`${ROOT}/products`)).key; await set(ref(db,`${ROOT}/products/${newId}`),{id:newId,...data}); }
      closeModal(); toast("Produk disimpan");
    });
}
async function deleteProduct(id){
  if(!confirm("Hapus produk ini?")) return;
  await remove(ref(db,`${ROOT}/products/${id}`)); toast("Produk dihapus");
}
function categoryForm(){
  openModal("Tambah Kategori",`
    <form>
      <label>Nama Kategori <input name="name" required /></label>
      <button class="btn btn-primary btn-block" type="submit" data-label="Tambah">Tambah</button>
    </form>`,async fd=>{
      const id=push(ref(db,`${ROOT}/categories`)).key;
      await set(ref(db,`${ROOT}/categories/${id}`),{id,name:fd.get("name").trim(),createdAt:Date.now()});
      closeModal(); toast("Kategori ditambah");
    });
}
async function deleteCategory(id){ if(!confirm("Hapus kategori ini?")) return; await remove(ref(db,`${ROOT}/categories/${id}`)); toast("Kategori dihapus"); }
async function deleteQris(){ if(!confirm("Hapus QRIS kustom? (Akan kembali ke QRIS default)")) return; await remove(ref(db,`${ROOT}/qris/main`)); toast("QRIS kustom dihapus"); }
async function approveOrder(id){
  if(!confirm("Setujui pembayaran?")) return;
  await update(ref(db,`${ROOT}/orders/${id}`),{status:"paid",verifiedAt:Date.now(),verifiedBy:state.profile.displayName});
  toast("Pembayaran disetujui, silakan kirim akun");
}
async function rejectOrder(id){
  if(!confirm("Tolak pembayaran?")) return;
  await update(ref(db,`${ROOT}/orders/${id}`),{status:"rejected",rejectedAt:Date.now()});
  toast("Pembayaran ditolak");
}
function deliverOrder(id){
  const o=state.data.orders[id]; if(!o) return;
  const items=o.items||[];
  const forms=items.map((it,i)=>`
    <div style="border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;">
      <b>${escapeHTML(it.name)}</b>
      <label style="margin-top:8px;">Username <input name="u${i}" required /></label>
      <label>Password <input name="p${i}" required /></label>
      <label>Catatan <input name="n${i}" /></label>
    </div>`).join("");
  openModal("Kirim Akun ke Pembeli",`
    <form>${forms}
      <button class="btn btn-primary btn-block" type="submit" data-label="Kirim">Kirim Akun</button>
    </form>`,async fd=>{
      const accounts={};
      items.forEach((it,i)=>{ accounts[i]={username:fd.get("u"+i).trim(),password:fd.get("p"+i).trim(),note:fd.get("n"+i).trim()}; });
      await update(ref(db,`${ROOT}/orders/${id}`),{accounts,status:"delivered",deliveredAt:Date.now()});
      closeModal(); toast("Akun terkirim");
    });
}
renderNav();
</script>
</body>
</html>
